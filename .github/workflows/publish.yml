name: Publish

on:
  release:
    branches: [main]
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    permissions:
      id-token: write
      attestations: write
    # Must match the environment set in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/commit-check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # use fetch --all for setuptools_scm to work
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'

    # README.md is the long description PyPI shows, so its pre-commit `rev:`
    # is fixed at build time. Write this release's tag into it here, rather
    # than relying on a README bump landing on main before the release is
    # published. The workflow_dispatch dry run has no tag and skips this.
    - name: Pin the README to this release
      if: github.event_name == 'release'
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import os, pathlib, re, sys
        p = pathlib.Path("README.md")
        text, n = re.subn(r"(rev:\s*)v\d+\.\d+\.\d+", rf"\g<1>{os.environ['TAG']}", p.read_text())
        if n == 0:
            sys.exit("README.md has no `rev: vX.Y.Z` pin to update")
        p.write_text(text)
        PY
        grep -n "rev: v" README.md
        # The edit makes the tree dirty, and setuptools-scm would then build
        # X.Y.Z.post1.dev0 instead of X.Y.Z. Give it the tag's version.
        echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_COMMIT_CHECK=${TAG#v}" >> "$GITHUB_ENV"

    - name: Build wheel
      run: |
        # Install dependencies
        python -m pip install --only-binary :all: --upgrade pip
        python -m pip install --only-binary :all: ".[ci]"
        # Build wheel. --no-deps is load-bearing: without it pip also writes
        # every dependency's wheel into dist/, and the publish step uploads
        # the whole directory (it has no file-selection input), so PyPI is
        # asked to accept someone else's package under our project.
        python -m pip wheel --no-deps -w dist .
        # Check distribution
        twine check dist/commit_check*

    - name: Create attestations
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "dist/commit_check*"

    - name: Publish package to TestPyPI
      if: github.event_name == 'workflow_dispatch' && github.repository == 'commit-check/commit-check'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_TOKEN }}
      continue-on-error: true

    # Trusted Publishing (OIDC, no token): PyPI then stores the PEP 740
    # attestations this action makes and shows provenance on the release.
    - name: Publish package to PyPI
      if: github.event_name != 'workflow_dispatch' && github.repository == 'commit-check/commit-check'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

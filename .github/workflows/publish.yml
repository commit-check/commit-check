name: Publish

on:
  release:
    branches: [main]
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    permissions:
      id-token: write
      attestations: write
    # Must match the environment set in the PyPI trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/p/commit-check
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # use fetch --all for setuptools_scm to work
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.x'

    - name: Build wheel
      run: |
        # Install dependencies
        python -m pip install --only-binary :all: --upgrade pip
        python -m pip install --only-binary :all: ".[ci]"
        # Build wheel. --no-deps is load-bearing: without it pip also writes
        # every dependency's wheel into dist/, and the publish step uploads
        # the whole directory (it has no file-selection input), so PyPI is
        # asked to accept someone else's package under our project.
        python -m pip wheel --no-deps -w dist .
        # Check distribution
        twine check dist/commit_check*

    - name: Create attestations
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: "dist/commit_check*"

    - name: Publish package to TestPyPI
      if: github.event_name == 'workflow_dispatch' && github.repository == 'commit-check/commit-check'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: https://test.pypi.org/legacy/
        password: ${{ secrets.TEST_PYPI_TOKEN }}
      continue-on-error: true

    # Trusted Publishing (OIDC, no token): PyPI then stores the PEP 740
    # attestations this action makes and shows provenance on the release.
    - name: Publish package to PyPI
      if: github.event_name != 'workflow_dispatch' && github.repository == 'commit-check/commit-check'
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

    # After the upload to PyPI, so that a failure here cannot hold it back.
    - name: Keep the wheel for the image job
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: commit-check_wheel
        path: dist/commit_check*.whl

  # The container image behind the GitLab CI/CD component and the Bitbucket
  # pipe: ghcr.io/commit-check/commit-check. It holds the wheel PyPI just got.
  image:
    needs: publish
    if: github.event_name == 'release' && github.repository == 'commit-check/commit-check'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/commit-check/commit-check
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Download the wheel
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: commit-check_wheel
        path: dist

    - name: Build the image
      run: docker build -t "$IMAGE:build" .

    - name: Test the image
      run: sh docker/test.sh "$IMAGE:build"

    # Tags: the release (2.23.0), and for a full release also its major
    # version (2) and latest. A pre-release moves neither of those two.
    - name: Push the image
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.release.tag_name }}
        PRERELEASE: ${{ github.event.release.prerelease }}
      run: |
        version="${TAG#v}"
        tags="$version"
        if [ "$PRERELEASE" != "true" ]; then
          tags="$tags ${version%%.*} latest"
        fi
        echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        for tag in $tags; do
          docker tag "$IMAGE:build" "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
        done

name: CodSpeed

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
    paths:
      - "commit_check/**"
      - "tests/**"
      - ".github/workflows/codspeed.yml"
      - "pyproject.toml"
      - ".test_durations"
  pull_request:
    branches:
      - "main"
    paths:
      - "commit_check/**"
      - "tests/**"
      - ".github/workflows/codspeed.yml"
      - "pyproject.toml"
      - ".test_durations"
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Split the benchmark set across CI jobs instead of across processes in
        # one job. Each shard runs single-process, so every benchmark is
        # measured in the same context as a serial run and the simulated numbers
        # stay stable; CodSpeed aggregates the shards into one report.
        # https://codspeed.io/docs/benchmarks/python
        # Sharding is done with pytest-split (not the pytest-test-groups shown
        # in the CodSpeed docs): under --codspeed on pytest 9, test-groups does
        # not split and every shard runs the full set. pytest-split partitions
        # the --codspeed selection into disjoint groups (--group is 1-indexed).
        # Groups are balanced by run time from .test_durations, which holds
        # per-benchmark times measured in this workflow (simulation mode).
        # Benchmarks missing from it are counted at the average time; refresh
        # it when shard run times drift apart. --splits follows the matrix size.
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e .[test]

      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          run: pytest tests/ --codspeed --splits ${{ strategy.job-total }} --group ${{ matrix.shard }} --splitting-algorithm least_duration
          mode: simulation # https://codspeed.io/docs/instruments

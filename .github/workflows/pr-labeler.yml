name: PR Labeler

on:
  # pull_request_target event is required for auto-labeler on fork PRs
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  label:
    permissions:
      pull-requests: write
      contents: read
    uses: commit-check/.github/.github/workflows/pr-labeler.yml@main

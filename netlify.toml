# Netlify builds the documentation for deploy previews on pull requests.
#
# This file exists so the build is defined in version control rather than in
# Netlify's web UI: when the docs toolchain changes, the preview build changes
# with it in the same commit, and a mismatch shows up in review instead of
# silently producing an empty preview.

[build]
  command = "pip install '.[docs]' && mkdocs build --strict"
  publish = "site"

[build.environment]
  # MkDocs Material needs a modern Python; the package itself supports 3.10+.
  PYTHON_VERSION = "3.12"

# On a deploy preview, point the site at the preview itself. Without this the
# canonical links and the generated redirect stubs would send reviewers from
# the preview back to the production site, which defeats the purpose.
#
# SITE_URL has to be set here rather than in a [context.*.environment] block:
# those values are literals, so "${DEPLOY_PRIME_URL}" would reach MkDocs
# unexpanded and be rejected as a URL without a scheme. The build command runs
# in a shell, where the variable actually expands.
[context.deploy-preview]
  command = "pip install '.[docs]' && SITE_URL=\"$DEPLOY_PRIME_URL/\" mkdocs build --strict"

[context.branch-deploy]
  command = "pip install '.[docs]' && SITE_URL=\"$DEPLOY_PRIME_URL/\" mkdocs build --strict"

# Netlify normalises "/rules" and "/rules/" to the same resource by default.
# The build emits a redirect stub at rules.html for the old Sphinx URL, and
# with normalisation on, that stub is what gets served for the real page too —
# so /rules/ redirects to itself and never renders. Turn normalisation off so
# each path resolves to exactly the file it names.
[build.processing.html]
  pretty_urls = false

# Redirect the URLs the Sphinx site served. These are declared here rather
# than left to the emitted stubs so they take effect before file lookup,
# which keeps them clear of the page they point at. `splat` carries any
# fragment through.
[[redirects]]
  from = "/configuration.html"
  to = "/configuration/"
  status = 301
  force = true

[[redirects]]
  from = "/rules.html"
  to = "/rules/"
  status = 301
  force = true

[[redirects]]
  from = "/example.html"
  to = "/example/"
  status = 301
  force = true

[[redirects]]
  from = "/migration.html"
  to = "/migration/"
  status = 301
  force = true

[[redirects]]
  from = "/troubleshoot.html"
  to = "/troubleshoot/"
  status = 301
  force = true

[[redirects]]
  from = "/changelog.html"
  to = "/changelog/"
  status = 301
  force = true

[[redirects]]
  from = "/what-is-new.html"
  to = "/what-is-new/"
  status = 301
  force = true

[[redirects]]
  from = "/cli_args.html"
  to = "/cli/"
  status = 301
  force = true

[[redirects]]
  from = "/README.html"
  to = "/getting-started/installation/"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/genindex.html"
  to = "/"
  status = 301
  force = true
